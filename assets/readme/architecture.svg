<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">课历的浏览器内解析流程</title>
  <desc id="desc">PDF 通过后台线程中的 PDF.js worker 提取文字与坐标，再还原课表版面。HTML 和 JSON 提取课程记录后，与 PDF 路径汇入统一校验流程。React 页面提供预览与编辑，日历模块展开日期、处理停调课并导出 ICS。图中全部处理在用户浏览器内完成。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#817b74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="670" rx="20" fill="#f5f5f5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" fill="#292524">
    <g id="browser-boundary">
      <text x="60" y="57" font-size="24" font-weight="600">用户浏览器</text>
      <text x="1140" y="57" text-anchor="end" font-size="22" fill="#625e59">本地文件 → 日历文件</text>
    </g>
    <g id="connections" fill="none" stroke="#817b74" stroke-width="2" marker-end="url(#arrow)">
      <path d="M310 198v30"/>
      <path d="M310 326v42"/>
      <path d="M890 198v170"/>
      <path d="M310 462v48"/>
      <path d="M560 563h74"/>
    </g>
    <g id="pdf-worker">
      <rect x="60" y="98" width="500" height="100" rx="12" fill="#e5f5ef" stroke="#b7d9cd"/>
      <text x="88" y="140" font-size="30" font-weight="600">PDF · PDF.js worker</text>
      <text x="88" y="175" font-size="22" fill="#383530">后台读取文件，返回文字与坐标</text>
    </g>
    <g id="pdf-layout">
      <rect x="60" y="230" width="500" height="96" rx="12" fill="#ffffff" stroke="#d6d3d1"/>
      <text x="88" y="269" font-size="28" font-weight="600">课表版面还原</text>
      <text x="88" y="303" font-size="22" fill="#625e59">按坐标还原表格与列表</text>
    </g>
    <g id="web-import">
      <rect x="640" y="98" width="500" height="100" rx="12" fill="#ffffff" stroke="#d6d3d1"/>
      <text x="668" y="140" font-size="30" font-weight="600">HTML / JSON</text>
      <text x="668" y="175" font-size="22" fill="#625e59">提取课程记录</text>
    </g>
    <g id="normalized-courses">
      <rect x="60" y="372" width="1080" height="90" rx="12" fill="#ffffff" stroke="#d6d3d1"/>
      <text x="88" y="410" font-size="28" font-weight="600">统一课程数据</text>
      <text x="88" y="442" font-size="22" fill="#625e59">校验字段 · 解析周次与节次 · 去重</text>
    </g>
    <g id="react-preview">
      <rect x="60" y="516" width="500" height="104" rx="12" fill="#ffffff" stroke="#d6d3d1"/>
      <text x="88" y="557" font-size="28" font-weight="600">React 预览与编辑</text>
      <text x="88" y="593" font-size="22" fill="#625e59">核对课程、学期与作息</text>
    </g>
    <g id="calendar-export">
      <rect x="640" y="516" width="500" height="104" rx="12" fill="#292524"/>
      <text x="668" y="557" font-size="28" font-weight="600" fill="#ffffff">日历转换 → .ics</text>
      <text x="668" y="593" font-size="22" fill="#e7e5e4">展开日期，处理停调课并导出</text>
    </g>
  </g>
</svg>
